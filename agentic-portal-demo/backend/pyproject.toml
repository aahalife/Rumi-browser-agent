[project]
name = "agentic-portal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic[bedrock]>=0.70",
    "websockets>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "playwright>=1.47",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "portal", "agent", "harness"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
